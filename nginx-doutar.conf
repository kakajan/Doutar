# ==============================================================================
# Nginx Configuration for Doutar.ir (Vue 3 / Vite Production)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name doutar.ir www.doutar.ir;

    # ریدایرکت خودکار تمام ترافیک HTTP به HTTPS
    return 301 https://doutar.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.doutar.ir;

    # گواهی SSL (مسیر سرتیفیکیت سرور خود را جایگزین کنید)
    # ssl_certificate /etc/letsencrypt/live/doutar.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/doutar.ir/privkey.pem;

    # ریدایرکت نسخه با www به دامنه اصلی بدون www برای حفظ سئو
    return 301 https://doutar.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doutar.ir;

    # مسیر پوشه خروجی بیلد پروژه (dist)
    root /var/www/doutar/dist;
    index index.html;

    # گواهی SSL (مسیر سرتیفیکیت سرور خود را جایگزین کنید)
    # ssl_certificate /etc/letsencrypt/live/doutar.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/doutar.ir/privkey.pem;

    # تنظیمات امنیتی SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------------------------
    # ۱. فشرده‌سازی Gzip (کاهش چشمگیر حجم انتقال داده)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------------------------
    # ۲. هدرهای امنیتی (Security Headers)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # ۳. کش بلندمدت (۱ ساله) برای فایل‌های استاتیک هش‌شده Vite و وب‌فونت‌ها
    # این بخش مستقیماً امتیاز Cache-Policy در PageSpeed را به ۱۰۰ می‌رساند
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|webp|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # ۴. فایل‌های صوتی و فایل‌های فشرده آلبوم‌ها (پشتیبانی از Seek پلیر با Byte-Range)
    # --------------------------------------------------------------------------
    location ~* \.(?:mp3|wav|ogg|zip)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # ۵. کش کوتاه‌مدت برای فایل‌های HTML (برای اطمینان از دریافت آپدیت‌ها توسط کاربر)
    # --------------------------------------------------------------------------
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # ۶. مسیریابی SPA و صفحات پیش‌رندر شده (SEO Pre-rendered Pages)
    # $uri/ باعث می‌شود فولدرهای /album/unity/ و ... مستقیماً فایل HTML پیش‌رندر شده خود را لود کنند
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # صفحه خطای اختصاصی ۴۰۴
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
